<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Sillah Kanu Series Colouring Book for Kids</title>
<style>
  :root{
    --paper:#FFFDF6;
    --board:#F3EAD6;
    --ink:#1A1A1A;
    --rule:#D8CBAE;
    --tray:#3E2A18;
    --tray2:#573A21;
    --cw:44px;
    --font-hand:"Comic Sans MS","Chalkboard SE","Segoe Print","Trebuchet MS",sans-serif;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:var(--font-hand);
    background:var(--board);
    color:var(--ink);
    overflow:hidden;
    -webkit-text-size-adjust:100%;
  }

  /* ---- frame: fills the screen on any device ---- */
  .shell{display:flex;flex-direction:column;height:100vh;height:100dvh}
  .col{flex:1;min-width:0;display:flex;flex-direction:column;min-height:0}

  header{
    flex:0 0 auto;text-align:center;padding:7px 10px;
    border-bottom:3px solid var(--ink);background:var(--paper);
  }
  header h1{
    margin:0;font-size:clamp(13px,3.6vw,24px);line-height:1.2;
    text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px;
  }
  header p{margin:4px 0 0;font-size:clamp(10px,2.6vw,13px);color:#6B5A42}

  .strip{
    flex:0 0 auto;display:flex;gap:5px;overflow-x:auto;padding:6px 8px;
    background:var(--paper);border-bottom:2px solid var(--rule);scrollbar-width:none;
  }
  .strip::-webkit-scrollbar{display:none}
  .strip button{
    flex:0 0 auto;width:34px;height:34px;border-radius:9px;
    border:2px solid var(--ink);background:#fff;
    font-family:var(--font-hand);font-size:16px;font-weight:bold;cursor:pointer;
  }
  .strip button[aria-current="true"]{background:var(--ink);color:#fff}
  .strip button.done{background:#FFE9A8}
  .strip button.done[aria-current="true"]{background:var(--ink);color:#fff}

  main{flex:1;min-width:0;min-height:0;display:flex;justify-content:center;padding:8px;overflow:auto}
  .card{
    flex:1;min-width:0;min-height:0;max-width:980px;width:100%;
    display:flex;flex-direction:column;gap:6px;
    background:var(--paper);border:3px solid var(--ink);border-radius:14px;padding:10px;
  }

  .head{flex:0 0 auto;min-width:0}
  .letterline{
    display:flex;justify-content:center;gap:min(12vw,80px);
    font-size:clamp(30px,8.5vh,74px);font-weight:bold;line-height:1;
  }
  .letterline span{border-bottom:5px solid var(--ink);padding:0 12px 3px}
  .phrase{
    text-align:center;margin:6px 0 0;
    font-size:clamp(17px,5.2vw,34px);line-height:1.2;
  }

  .work{flex:1;min-height:0;display:flex;gap:10px;align-items:stretch}
  .sheet{
    flex:1 1 auto;min-width:0;min-height:120px;
    background:#fff;border:2px dashed var(--rule);border-radius:10px;padding:4px;
    display:flex;align-items:center;justify-content:center;touch-action:manipulation;
  }
  .sheet svg{width:auto;height:auto;max-width:100%;max-height:100%}
  aside{
    flex:0 0 26%;max-width:190px;min-width:76px;
    display:flex;flex-direction:column;justify-content:center;gap:4px;
  }
  .refbox{background:#fff;border:2px solid var(--ink);border-radius:10px;padding:4px}
  .refbox img{display:block;width:100%;height:auto;image-rendering:auto}
  .reflabel{margin:0;font-size:clamp(10px,2.6vw,13px);text-align:center;color:#6B5A42}

  .f{fill:#fff;cursor:pointer}
  .sheet .f{transition:fill .12s ease}
  .sheet .f:active{opacity:.8}
  .ink{fill:#111;pointer-events:none}

  .pager{flex:0 0 auto;display:flex;gap:8px}
  .pager button{
    flex:1;font-family:var(--font-hand);font-size:clamp(14px,3.6vw,18px);padding:9px;
    border:3px solid var(--ink);border-radius:11px;background:#fff;cursor:pointer;
  }
  .pager button:disabled{opacity:.4;cursor:default}

  /* ---- crayon tray ---- */
  .tray{
    flex:0 0 auto;
    background:linear-gradient(var(--tray2),var(--tray));
    border-top:4px solid #241505;
    padding:6px 8px max(8px,env(safe-area-inset-bottom));
  }
  .traytop{display:flex;align-items:center;gap:8px;justify-content:space-between;margin-bottom:4px}
  .traytop p{
    margin:0;color:#FFE9C4;font-size:clamp(10px,2.8vw,13px);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .tools{flex:0 0 auto;display:flex;gap:6px}
  .tools button{
    font-family:var(--font-hand);font-size:clamp(11px,3vw,14px);padding:6px 9px;
    border:2px solid #241505;border-radius:9px;background:#FFE9C4;cursor:pointer;
  }
  .crayons{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;overflow-x:auto;padding:11px 0 5px;scrollbar-width:none}
  .crayons::-webkit-scrollbar{display:none}
  .crayon{
    flex:0 0 auto;border:0;background:none;cursor:pointer;
    padding:3px 3px 2px;border-radius:12px;
    opacity:.62;transform:translateY(9px) scale(.9);
    transition:transform .14s ease, opacity .14s ease, background .14s ease;
  }
  .crayon svg{display:block;width:var(--cw);height:calc(var(--cw) * 2.18)}
  .crayon[aria-pressed="true"]{
    opacity:1;transform:translateY(-5px) scale(1.05);
    background:#FFE9C4;box-shadow:0 3px 0 #241505;
  }
  .crayon[aria-pressed="true"]::after{
    content:"✓";display:block;text-align:center;line-height:1;
    font-size:calc(var(--cw) * .34);color:#241505;margin-top:0;
  }
  .traytop p .swatch{
    display:inline-block;width:14px;height:14px;border-radius:4px;
    border:2px solid #FFE9C4;vertical-align:-3px;margin-right:5px;
  }


  @media (max-height:720px) and (orientation:portrait){
    :root{--cw:34px}
    header p{display:none}
  }

  /* ---- wide screens: picture gets the full height of the card ---- */
  @media (min-width:820px){
    .card{
      display:grid;
      grid-template-columns:minmax(160px,215px) minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"head sheet" "ref sheet" "pager sheet";
      gap:12px;
    }
    .head{grid-area:head}
    .work{display:contents}
    .sheet{grid-area:sheet}
    aside{grid-area:ref;max-width:none;min-width:0}
    .refbox{max-width:175px;margin:0 auto;width:100%}
    .pager{grid-area:pager}
    .letterline{font-size:clamp(30px,5.2vw,64px);gap:34px}
    .phrase{font-size:clamp(19px,2.4vw,30px)}
  }

  /* ---- tablet and laptop ---- */
  @media (min-width:700px){
    :root{--cw:54px}
    .card{padding:14px;gap:10px}
    .strip button{width:38px;height:38px;font-size:18px}
    .crayons{justify-content:center}
    .traytop{justify-content:center}
    .traytop p{flex:0 1 auto}
  }
  @media (min-width:1100px){
    :root{--cw:60px}
    main{padding:14px}
  }

  /* ---- short screens: crayons move to a side rack ---- */
  @media (max-height:560px) and (orientation:landscape){
    :root{--cw:30px}
    .shell{flex-direction:row}
    header p,.reflabel{display:none}
    .head{display:flex;align-items:center;justify-content:center;gap:16px;flex-wrap:wrap}
    .letterline{font-size:clamp(22px,9vh,38px);gap:20px}
    .phrase{margin:0;font-size:clamp(15px,4.4vh,22px)}
    .strip button{width:30px;height:30px;font-size:15px}
    .strip{padding:4px 6px}
    .pager button{padding:5px;font-size:13px}
    header{padding:4px 8px}
    main{padding:5px}
    .card{padding:8px;gap:5px}
    .tray{
      width:124px;border-top:0;border-left:4px solid #241505;
      display:flex;flex-direction:column;padding:6px;
    }
    .traytop{flex-direction:column;margin:0 0 4px}
    .traytop p{display:none}
    .tools{flex-direction:column;width:100%}
    .tools button{width:100%}
    .crayons{
      flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;
      overflow-x:hidden;overflow-y:auto;gap:6px;padding:6px 0 0;
    }
    .crayon{transform:scale(.9)}
    .crayon[aria-pressed="true"]{transform:scale(1.04)}
  }

  @media (prefers-reduced-motion:reduce){
    *{transition:none !important}
  }
  @media print{
    body{overflow:visible}
    .tray,.strip,.pager,header p,aside{display:none}
    .shell{height:auto}
  }
</style>
</head>
<body>

<div class="shell">
<div class="col">

<header>
  <h1>Sillah Kanu Series Colouring Book for Kids</h1>
  <p>Pick a crayon, then tap a part of the picture to colour it</p>
</header>

<nav class="strip" id="strip" aria-label="Choose a letter"></nav>

<main>
  <div class="card">
    <div class="head">
      <div class="letterline"><span id="big"></span><span id="small"></span></div>
      <p class="phrase" id="phrase"></p>
    </div>
    <div class="work">
      <div class="sheet" id="sheet"></div>
      <aside>
        <div class="refbox" id="ref"></div>
        <p class="reflabel">Colour it like this</p>
      </aside>
    </div>
    <div class="pager">
      <button id="prev">&#8592; Back</button>
      <button id="next">Next &#8594;</button>
    </div>
  </div>
</main>

</div><!-- /col -->

<div class="tray">
  <div class="traytop">
    <p id="hint"></p>
    <div class="tools">
      <button id="rub">Rub out</button>
      <button id="clear">Start again</button>
    </div>
  </div>
  <div class="crayons" id="crayons"></div>
</div>

</div><!-- /shell -->

  const dark = hex === "#FFFFFF" ? "#DDD" : "rgba(0,0,0,.22)";
  return `<svg viewBox="0 0 34 74" aria-hidden="true">
    <path d="M17,2 L27,20 L27,70 L7,70 L7,20 Z" fill="${hex}" stroke="#241505" stroke-width="2" stroke-linejoin="round"/>
    <path d="M17,2 L27,20 L20,20 L17,2 Z" fill="${dark}"/>
    <rect x="7" y="34" width="20" height="12" fill="rgba(255,255,255,.35)"/>
  </svg>`;
}

/* ---------- build the letter strip ---------- */
const strip = document.getElementById("strip");
LETTERS.forEach(L=>{
  const b = document.createElement("button");
  b.textContent = L;
  b.onclick = ()=>show(L);
  b.dataset.letter = L;
  strip.appendChild(b);
});

/* ---------- build the crayon box ---------- */
const crayonBox = document.getElementById("crayons");
function buildCrayons(){
  const use = ITEMS[current].use;
  crayonBox.innerHTML = "";
  crayonBox.scrollTop = 0; crayonBox.scrollLeft = 0;
  use.forEach(name=>{
    const hex = COLOURS[name];
    const b = document.createElement("button");
    b.className = "crayon";
    b.innerHTML = crayonSVG(hex);
    b.title = name;
    b.setAttribute("aria-label", name + " crayon");
    b.setAttribute("aria-pressed", hex === pick);
    b.onclick = ()=>{ pick = hex; markCrayons(); };
    crayonBox.appendChild(b);
  });
}
function markCrayons(){
  [...crayonBox.children].forEach(b=>{
    b.setAttribute("aria-pressed", COLOURS[b.title] === pick);
  });
  const name = nameOf(pick);
  document.getElementById("hint").innerHTML =
    '<span class="swatch" style="background:' + pick + '"></span>Using <b>' + NAMES[name] + '</b>';
}

/* ---------- draw a page ---------- */
const sheet = document.getElementById("sheet");
const ref = document.getElementById("ref");

function show(L){
  current = L;
  const item = ITEMS[L];
  document.getElementById("big").textContent = L;
  document.getElementById("small").textContent = L.toLowerCase();
  document.getElementById("phrase").innerHTML = L + " is for <b>" + item.w + "</b>";
  const parts = item.regs.map(d => '<path class="f" d="' + d + '"/>').join("");
  sheet.innerHTML = '<svg viewBox="0 0 ' + item.vw + ' ' + item.vh + '" style="aspect-ratio:'
    + item.vw + '/' + item.vh + '"><g transform="' + item.tr + '">' + parts
    + '<path class="ink" d="' + item.ink + '"/></g></svg>';
  ref.innerHTML = '<img alt="The ' + item.w.toLowerCase() + ' coloured in, from the book" src="data:image/png;base64,'
    + item.ref + '">';

  painted[L] = painted[L] || {};
  history[L] = history[L] || [];
  const shapes = sheet.querySelectorAll(".f");
  shapes.forEach((p,i)=>{
    if(painted[L][i]) p.style.fill = painted[L][i];
    p.onclick = ()=>{
      history[L].push([i, painted[L][i] || ""]);
      painted[L][i] = pick;
      p.style.fill = pick;
      updateStrip();
    };
  });

  if(!ITEMS[L].use.includes(nameOf(pick))) pick = COLOURS[ITEMS[L].use[0]];
  buildCrayons();
  markCrayons();
  updateStrip();
  document.getElementById("prev").disabled = LETTERS.indexOf(L) === 0;
  document.getElementById("next").disabled = LETTERS.indexOf(L) === LETTERS.length-1;
  const tab = strip.querySelector(`[data-letter="${L}"]`);
  if(tab && tab.scrollIntoView) tab.scrollIntoView({inline:"center", block:"nearest", behavior:"smooth"});
  const mainEl = document.querySelector("main"); if(mainEl) mainEl.scrollTop = 0;
}

function nameOf(hex){
  return ORDER.find(n=>COLOURS[n] === hex) || "red";
}

function updateStrip(){
  LETTERS.forEach(L=>{
    const tab = strip.querySelector(`[data-letter="${L}"]`);
    tab.setAttribute("aria-current", L === current);
    const n = painted[L] ? Object.keys(painted[L]).length : 0;
    tab.classList.toggle("done", n > 0);
  });
}

/* ---------- tools ---------- */
document.getElementById("rub").onclick = ()=>{
  const h = history[current];
  if(!h || !h.length) return;
  const [i, prev] = h.pop();
  const p = sheet.querySelectorAll(".f")[i];
  if(prev){ painted[current][i] = prev; p.style.fill = prev; }
  else { delete painted[current][i]; p.style.fill = ""; }
  updateStrip();
};
document.getElementById("clear").onclick = ()=>{
  painted[current] = {};
  history[current] = [];
  sheet.querySelectorAll(".f").forEach(p=>{ p.style.fill = ""; });
  updateStrip();
};
document.getElementById("prev").onclick = ()=>{
  const i = LETTERS.indexOf(current); if(i>0) show(LETTERS[i-1]);
};
document.getElementById("next").onclick = ()=>{
  const i = LETTERS.indexOf(current); if(i<LETTERS.length-1) show(LETTERS[i+1]);
};

show("A");
</script>
</body>
</html>
